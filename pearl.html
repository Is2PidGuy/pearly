<!DOCTYPE html>
<html>
<body>

<canvas id="myCanvas" width="500" height="500" style="border:1px solid #000000;">
Your browser does not support the HTML canvas tag.
</canvas>
<script>
var items = [];
var L = 20;
var W=500;
var H=500;
for (var i=0;i<4;++i) {
items.push({x: 100, y: 200+i*L});
}
var canvas = document.getElementById("myCanvas");
const ctx = canvas.getContext("2d");
// 2. Create a new Image object
const img = new Image();
const food_img = new Image();

// 3. Define what happens AFTER the image loads
img.onload = function() {
    // 4. Draw the image onto the canvas at coordinates (x: 0, y: 0)
    ctx.drawImage(img, 0, 0);
};

// 5. Set the source URL (this triggers the loading process)
img.src = "./pearl.png";
food_img.src = "./food.png";
keys = {}
angle = -Math.PI / 2;
d = 5*Math.PI / 180;
let foods = [{ x: 300, y: 300, size:L}]
let speed=1;
let score=0;
function wrap(item){
    var x=item.x;
    while (x>W)x=x-W;
    while(x<0)x=W+x;
    var y=item.y;
    if (y>H)y=y-H;
    while(y<0)y=H+y;
    return {x:x,y:y};
}
let eatAudio = new Audio('./marble.mp3');

function step() {
 if (keys["ArrowLeft"]) {
        angle -= d;
    }
     if (keys["ArrowRight"]) {
        angle += d;
    }
if (1||keys["ArrowUp"]) {
        items[0].x += speed* Math.cos(angle);
items[0].y += speed* Math.sin(angle);

    }
   var virtualhead=wrap(items[0]);
   var food = foods[foods.length-1];
   if (Math.hypot(virtualhead.x-food.x,virtualhead.y-food.y)<L){
    eatAudio.play();
   foods.push({ x: Math.random()*300, y: Math.random()*300, size: L});
   speed+=0.1;
   score++;
   items.push({x:items[items.length-1].x,y:items[items.length-1].y});
   }

  ctx.fillStyle = "rgb(250,250,250)";
ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle = "red";
for (var i=1;i<items.length;++i) {
    var dist = Math.hypot(items[i].x-items[i-1].x,items[i].y-items[i-1].y);
    var u = items[i-1].x-items[i].x;
    var v = items[i-1].y-items[i].y;
    u/=dist;
    v/=dist;
    items[i].x=items[i-1].x-u*L;
    items[i].y=items[i-1].y-v*L;
    
}
// handle out of screen
for (var i=0;i<items.length;++i) {
var item=items[i];
   var vitem=wrap(item);
ctx.drawImage(img, vitem.x,vitem.y,L,L);

}
ctx.drawImage(food_img, food.x, food.y, L,L);
for (var i=0;i<foods.length;++i){
    var food=foods[i];
    ctx.drawImage(food_img, food.x, food.y, food.size,food.size);
}
foods=foods.filter(f=>f.size>0);
for (var i=0;i+1<foods.length;++i){
    foods[i].size--;
}
ctx.fillStyle="rgb(0,0,0)";
ctx.font="20px Ariel";
ctx.fillText("Score " + score, W-80,30);
requestAnimationFrame(step);

}

requestAnimationFrame(step);
document.addEventListener("keyup", (event) => {
   keys[event.key] = false;
});
document.addEventListener("keydown", (event) => {
    console.log(`Key pressed: ${event.key}`);
keys[event.key] = true;
   
    
});
</script>
</body>
</html>
